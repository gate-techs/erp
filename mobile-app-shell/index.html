<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ALA ORBIT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #012436;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(254, 174, 44, 0.2);
            border-top-color: #FEAE2C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 20px;
            font-weight: 700;
            color: #FEAE2C;
            letter-spacing: 0.5px;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>ALA ORBIT</h2>
    <p>جاري تحميل بوابة الموظفين...</p>
    <script>
        // Redirect to live production server if not loaded automatically
        setTimeout(function() {
            window.location.href = "https://edu.astroleaderskw.com/portal/splash";
        }, 1200);
    </script>
</body>
</html>
